name: HeroesDragon Android
on:
  workflow_dispatch:
  push:
    branches: [heroesdragon-android]
    paths: ['.github/workflows/heroesdragon.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container: wesnoth/wesnoth:android
    env:
      API: 23
      ANDROID_NDK_ROOT: /opt/android-sdk-update-manager/ndk/28.0.13004108
      ANDROID_NDK_HOME: /opt/android-sdk-update-manager/ndk/28.0.13004108
      BUILDBASEDIR: ${{ github.workspace }}/packaging/android
      PREFIXDIR: ${{ github.workspace }}/packaging/android/prefix
      DOWNLOADDIR: ${{ github.workspace }}/packaging/android/download
      BUILDDIR: ${{ github.workspace }}/packaging/android/build
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare HeroesDragon Android configuration
        shell: bash
        run: |
          echo "BUILDBASEDIR=$GITHUB_WORKSPACE/packaging/android" >> "$GITHUB_ENV"
          echo "PREFIXDIR=$GITHUB_WORKSPACE/packaging/android/prefix" >> "$GITHUB_ENV"
          echo "DOWNLOADDIR=$GITHUB_WORKSPACE/packaging/android/download" >> "$GITHUB_ENV"
          echo "BUILDDIR=$GITHUB_WORKSPACE/packaging/android/build" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('packaging/android')
          p = root / 'build.gradle'
          p.write_text(p.read_text().replace("version '8.7.0'", "version '8.10.1'"))
          p = root / 'app/build.gradle'
          text = p.read_text().replace('compileSdk 35', 'compileSdk 36').replace('targetSdk 35', 'targetSdk 36')
          text = text.replace('26.3.11579264', '28.0.13004108')
          text = text.replace('applicationId "org.wesnoth.Wesnoth"', 'applicationId "com.superphantomtiger.heroesdragon"')
          p.write_text(text)
          p = root / 'app/src/main/AndroidManifest.xml'
          p.write_text(p.read_text().replace('android:authorities="org.wesnoth.Wesnoth.fileprovider"', 'android:authorities="${applicationId}.fileprovider"'))
          for p in (root / 'app/src/main/res').glob('values*/strings.xml'):
              p.write_text(re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">HeroesDragon</string>', p.read_text()))
          PY
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;28.0.13004108"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          chmod +x packaging/android/gradlew
      - name: Apply mobile touch controls and bundled interface
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, json, subprocess
          from pathlib import Path
          payload = json.loads(gzip.decompress(base64.b64decode('')))
          patch = base64.b64decode(payload['patch'])
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          for name, content in payload['files'].items():
              p = Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(content))
          PY
      - name: Restore native dependencies
        id: deps
        uses: actions/cache@v5
        with:
          path: packaging/android/prefix
          key: heroesdragon-android-ndk28-16kb-v1-${{ hashFiles('packaging/android/build-android-dependencies/*') }}
      - name: Build native dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: packaging/android
        run: ./gradlew buildCppDepends
      - name: Save completed native dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: packaging/android/prefix
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Build game and test APKs
        working-directory: packaging/android
        run: ./gradlew buildCppSource assembleDebug bundleDebug
      - name: Verify 64-bit native libraries support 16 KB pages
        shell: bash
        run: |
          python3 - <<'PY'
          """Check 64-bit APK LOAD alignment and Android's rounded RELRO protection range."""
          import struct
          import zipfile
          from pathlib import Path
          
          PAGE = 16384
          
          def relro_overlaps_writable(headers):
              problems = []
              for kind, flags, offset, address, physical, filesz, memsz, alignment in headers:
                  if kind != 0x6474e552 or not memsz:
                      continue
                  end = address + memsz
                  start_page = address // PAGE * PAGE
                  end_page = (end + PAGE - 1) // PAGE * PAGE
                  for load in headers:
                      if load[0] != 1 or not load[1] & 2:
                          continue
                      lo = max(start_page, load[3])
                      hi = min(end_page, load[3] + load[6])
                      if lo < hi and (lo < address or hi > end):
                          problems.append((lo, hi))
              return problems
          
          def header(kind, addr, size, flags=2, alignment=PAGE):
              return (kind, flags, 0, addr, addr, size, size, alignment)
          
          # A padded segment is safe even when RELRO ends inside a page.
          assert not relro_overlaps_writable([header(1, 0x10000, 0x1000), header(1, 0x15000, 0x1000), header(0x6474e552, 0x10000, 0x1000)])
          # Writable bytes directly after RELRO in its rounded page must fail.
          assert relro_overlaps_writable([header(1, 0x10000, 0x2000), header(0x6474e552, 0x10000, 0x1000)])
          # Writable bytes immediately before an unaligned RELRO start must also fail.
          assert relro_overlaps_writable([header(1, 0x10000, 0x4000), header(0x6474e552, 0x11000, 0x3000)])
          
          def check(directory):
              failures, checked, padded = [], 0, 0
              for apk in Path(directory).rglob('*.apk'):
                  with zipfile.ZipFile(apk) as archive:
                      for name in archive.namelist():
                          if not name.startswith(('lib/arm64-v8a/', 'lib/x86_64/')) or not name.endswith('.so'):
                              continue
                          data = archive.read(name)
                          assert data[:6] == b'\x7fELF\x02\x01', name
                          offset = struct.unpack_from('<Q', data, 32)[0]
                          size, count = struct.unpack_from('<HH', data, 54)
                          assert size == 56 and offset + size * count <= len(data), name
                          headers = [struct.unpack_from('<IIQQQQQQ', data, offset + i * size) for i in range(count)]
                          for h in headers:
                              if h[0] == 1 and (h[7] < PAGE or (h[3] - h[2]) % PAGE):
                                  failures.append(f'{apk.name}: {name}: invalid 16 KB LOAD alignment')
                          if relro_overlaps_writable(headers):
                              failures.append(f'{apk.name}: {name}: rounded RELRO covers writable bytes outside RELRO')
                          padded += any(h[0] == 0x6474e552 and (h[3] + h[6]) % PAGE for h in headers)
                          checked += 1
              assert checked, 'No 64-bit libraries found'
              assert not failures, '\n'.join(failures)
              print(f'Passed LOAD and RELRO memory-layout checks for {checked} libraries ({padded} padded RELRO segments). Runtime testing on a 16 KB device is still required.')
          
          check('packaging/android/app/build/outputs/apk/debug')
          PY
      - name: Save exact build source and notices
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git -c safe.directory="$GITHUB_WORKSPACE" add -N packaging/android/app/src/main/assets/heroesdragon-mobile
          git -c safe.directory="$GITHUB_WORKSPACE" diff > heroesdragon-build-changes.patch
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > heroesdragon-source-commit.txt
          cp COPYING heroesdragon-COPYING.txt
      - name: Upload APKs and source changes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: HeroesDragon-test-APKs
          if-no-files-found: error
          path: |
            packaging/android/app/build/outputs/apk/debug/*.apk
            heroesdragon-build-changes.patch
            heroesdragon-source-commit.txt
            heroesdragon-COPYING.txt
      - name: Upload debug AAB
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: HeroesDragon-debug-AAB-not-for-Play
          if-no-files-found: error
          path: packaging/android/app/build/outputs/bundle/debug/*.aab

